services:
  - type: web
    name: expense-management-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: expense_management_prod
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://yourdomain.com

databases:
  - name: postgres-db
    plan: free
    ipAllowList: []
